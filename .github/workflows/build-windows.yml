name: Build Denemo Windows installer

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jbenham2015/mxe:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Download LilyPond
        run: |
          cd /opt/mxe
          wget -q https://gitlab.com/lilypond/lilypond/-/releases/v2.24.4/downloads/lilypond-2.24.4-mingw-x86_64.zip
          unzip -q lilypond-2.24.4-mingw-x86_64.zip -d lilypond-2.24.4
          rm lilypond-2.24.4-mingw-x86_64.zip
          echo "LilyPond $(ls lilypond-2.24.4/)"

      - name: Build Denemo and create installer
        run: |
          ls packaging/
          bash packaging/BuildCI.sh

      - name: Print MXE log on failure
        if: failure()
        run: cat /opt/mxe/log/denemo_x86_64-w64-mingw32.shared || echo "No log found"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: denemo-windows-installer
          path: "*.exe"
