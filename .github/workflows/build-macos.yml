name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MacPorts
      id: cache-macports
      uses: actions/cache@v4
      with:
        path: /opt/local
        key: macports-${{ runner.os }}-${{ runner.arch }}-denemo-deps-v7
        restore-keys: |
          macports-${{ runner.os }}-${{ runner.arch }}-denemo-deps-

    - name: Install MacPorts
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        curl -LO https://raw.githubusercontent.com/GiovanniBussi/macports-ci/master/macports-ci
        source ./macports-ci install

    - name: Configure MacPorts variants
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        # Set +quartz -x11 globally so every port that supports these
        # variants picks them up automatically — no need to specify
        # +quartz on individual port install commands.
        printf '+quartz\n-x11\n-gnome\n' | sudo tee /opt/local/etc/macports/variants.conf

    - name: Install build dependencies
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        # Install in dependency order so each port finds its deps
        # already present with the correct +quartz variant active.

        # glib2 must come first — gtk3, evince, and others check for
        # glib2 +quartz before they will configure.
        sudo port install glib2

        # poppler (includes libpoppler-glib, no separate variant needed)
        sudo port install poppler

        # gtk3 and friends — these check for glib2 +quartz
        sudo port install \
          gtk3 \
          gdk-pixbuf2 \
          librsvg \
          gtksourceview3 \
          gobject-introspection

        # evince's remaining direct deps
        sudo port install \
          appstream-glib \
          desktop-file-utils \
          adwaita-icon-theme \
          gsettings-desktop-schemas \
          gspell \
          libsecret \
          libarchive \
          libspectre \
          texlive-bin

        # evince — by now gtk3 and glib2 are both +quartz
        sudo port install evince

        # Remaining Denemo build dependencies
        sudo port install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkgconfig \
          guile \
          aubio \
          portaudio \
          fftw-3 \
          libxml2 \
          fluidsynth \
          libsmf \
          portmidi \
          rubberband \
          libsndfile \
          gettext \
          jack \
          lilypond

    - name: Add MacPorts to PATH
      run: echo "/opt/local/bin:/opt/local/sbin" >> $GITHUB_PATH

    - name: Run autogen.sh
      run: ./autogen.sh

    - name: Configure
      run: |
        mkdir -p _build
        cd _build
        ../configure --prefix=/opt/local

    - name: Make
      run: |
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        cd _build
        sudo make install

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/MacPorts/Denemo.app dmg_staging/
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "Denemo-macOS" \
          -srcfolder dmg_staging \
          -ov \
          -format UDZO \
          Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
