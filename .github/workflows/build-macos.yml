name: Build Denemo for macOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MacPorts & ccache
      id: cache-macports
      uses: actions/cache@v4
        with:
          # Caching both the MacPorts installation and ccache data
          path: |
            /opt/local
            ~/.macports-ci-ccache
          key: macports-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            macports-${{ runner.os }}-

     - name: Setup MacPorts
        # Only run setup if we didn't get a perfect cache hit
        if: steps.cache-macports.outputs.cache-hit != 'true'
        uses: MacPorts/setup-macports@v1

      - name: Configure ccache in MacPorts
        if: steps.cache-macports.outputs.cache-hit != 'true'
        run: |
          sudo port install ccache
          # Enable ccache in MacPorts configuration
          sudo sed -i '' 's/configureccache no/configureccache yes/' /opt/local/etc/macports/macports.conf
          # Link the cache directory for MacPorts to use
          sudo mkdir -p /opt/local/var/macports/build/.ccache
          sudo ln -s ~/.macports-ci-ccache /opt/local/var/macports/build/.ccache

      - name: Update MacPorts
        run: sudo port selfupdate

      -  name: Install Denemo
      # MacPorts will automatically handle all required dependencies like GTK+ and LilyPond
        run: sudo port install denemo

      - name: Prepare Staging Directory
        run: |
          mkdir -p dmg_staging
          # Copy the .app bundle to our staging area
          cp -R /Applications/MacPorts/Denemo.app dmg_staging/
          # Create a symbolic link to /Applications for the "drag-to-install" experience
          ln -s /Applications dmg_staging/Applications

      - name: Create DMG
        run: |
          # Option A: Simple DMG using built-in hdiutil
          hdiutil create -volname "Denemo-macOS" -srcfolder dmg_staging -ov -format UDZO Denemo.dmg
          
          # Option B: (Optional) Professional-looking DMG using create-dmg
          # sudo port install create-dmg
          # create-dmg --volname "Denemo" --window-pos 200 120 --window-size 600 300 --icon-size 100 --icon "Denemo.app" 175 120 --hide-extension "Denemo.app" --app-drop-link 425 120 Denemo-Fancy.dmg dmg_staging/

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: denemo-macos-dmg
          path: Denemo.dmg



