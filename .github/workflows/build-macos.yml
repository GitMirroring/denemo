name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MacPorts
      id: cache-macports
      uses: actions/cache@v4
      with:
        path: /opt/local
        key: macports-${{ runner.os }}-${{ runner.arch }}-denemo-deps-v4
        restore-keys: |
          macports-${{ runner.os }}-${{ runner.arch }}-denemo-deps-

    - name: Install MacPorts
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        curl -LO https://raw.githubusercontent.com/GiovanniBussi/macports-ci/master/macports-ci
        source ./macports-ci install

    - name: Install build dependencies
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        # Install poppler first - libpoppler-glib is built as part of the
        # base poppler port (no separate +glib variant exists or is needed)
        sudo port install poppler

        # Pre-install evince's direct deps explicitly before evince itself.
        # gobject-introspection in particular needs to be fully settled on
        # Sequoia before evince's own meson/gobject configure step runs.
        sudo port install \
          gobject-introspection \
          appstream-glib \
          desktop-file-utils \
          adwaita-icon-theme \
          gdk-pixbuf2 \
          gsettings-desktop-schemas \
          gspell \
          libsecret \
          libarchive \
          libspectre \
          texlive-bin

        # Now install evince itself
        sudo port install evince +quartz

        # Install remaining Denemo build dependencies
        sudo port install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkgconfig \
          gtk3 +quartz \
          librsvg +quartz \
          gtksourceview3 +quartz \
          guile \
          aubio \
          portaudio \
          fftw-3 \
          libxml2 \
          fluidsynth \
          libsmf \
          portmidi \
          rubberband \
          libsndfile \
          gettext \
          jack \
          lilypond

    - name: Add MacPorts to PATH
      run: echo "/opt/local/bin:/opt/local/sbin" >> $GITHUB_PATH

    - name: Run autogen.sh
      run: ./autogen.sh

    - name: Configure
      run: |
        mkdir -p _build
        cd _build
        ../configure --prefix=/opt/local

    - name: Make
      run: |
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        cd _build
        sudo make install

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/MacPorts/Denemo.app dmg_staging/
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "Denemo-macOS" \
          -srcfolder dmg_staging \
          -ov \
          -format UDZO \
          Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
