name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MacPorts & ccache
      id: cache-macports
      uses: actions/cache@v4
      with:
        path: |
          /opt/local
          ~/.macports-ci-ccache
        key: macports-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          macports-${{ runner.os }}-

    - name: Setup MacPorts
      if: steps.cache-macports.outputs.cache-hit != 'true'
      uses: MacPorts/setup-macports@v1

    - name: Configure ccache in MacPorts
      if: steps.cache-macports.outputs.cache-hit != 'true'
      run: |
        sudo port install ccache
        sudo sed -i '' 's/configureccache no/configureccache yes/' /opt/local/etc/macports/macports.conf
        sudo mkdir -p /opt/local/var/macports/build/.ccache
        sudo ln -s ~/.macports-ci-ccache /opt/local/var/macports/build/.ccache

    - name: Update MacPorts
      run: sudo port selfupdate

    - name: Install Denemo
      run: sudo port install denemo

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/MacPorts/Denemo.app dmg_staging/
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create -volname "Denemo-macOS" -srcfolder dmg_staging -ov -format UDZO Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
