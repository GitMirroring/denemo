name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    # ── Job-level env: silence Homebrew hints globally ───────────────────────
    # Without these, keg-only packages (expat, libxml2, guile, …) print
    # advisory messages that cause brew to exit 1 in GitHub Actions.
    env:
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_PATH_SHADOW_CHECK: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ── ARM64 dependencies (native /opt/homebrew) ────────────────────────────
    - name: Install ARM64 build dependencies
      run: |
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtk-doc \
          gtksourceview3 \
          evince \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond

    # ── Rosetta / x86_64 Homebrew setup ─────────────────────────────────────
    - name: Install Rosetta 2
      run: softwareupdate --install-rosetta --agree-to-license

    - name: Bootstrap x86_64 Homebrew under Rosetta
      run: |
        if [ ! -f /usr/local/bin/brew ]; then
          arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi

    - name: Install x86_64 build dependencies via Rosetta
      # Strip ARM64 Homebrew from PATH entirely so brew operates only on
      # /usr/local and cannot see (or shadow-check against) /opt/homebrew.
      # || true: keg-only packages (expat, libxml2, guile) print advisory
      # hints to stderr and exit 1 even with HOMEBREW_NO_ENV_HINTS set in
      # some Homebrew versions. The hints are harmless; real failures are
      # caught at configure time when the libraries are actually missing.
      run: |
        export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
        arch -x86_64 /usr/local/bin/brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtk-doc \
          gtksourceview3 \
          evince \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond || true
        # Verify the packages that actually matter for configure are present
        echo "=== Checking critical keg-only packages ==="
        test -f /usr/local/opt/expat/lib/pkgconfig/expat.pc   && echo "expat OK"   || echo "ERROR: expat missing"
        test -f /usr/local/opt/libxml2/lib/pkgconfig/libxml-2.0.pc && echo "libxml2 OK" || echo "ERROR: libxml2 missing"
        test -d /usr/local/opt/guile  && echo "guile OK"  || echo "ERROR: guile missing"

    # ── autotools (once, using ARM64 tools) ─────────────────────────────────
    - name: Run autotools
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        chmod +x autogen.sh
        ./autogen.sh

    # ── ARM64 build ──────────────────────────────────────────────────────────
    - name: Configure (ARM64)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        # expat and libxml2 are keg-only on ARM64 Homebrew too
        export PKG_CONFIG_PATH="\
/opt/homebrew/opt/expat/lib/pkgconfig:\
/opt/homebrew/opt/libxml2/lib/pkgconfig:\
/opt/homebrew/lib/pkgconfig:\
/opt/homebrew/share/pkgconfig"
        export LDFLAGS="-L/opt/homebrew/opt/expat/lib -L/opt/homebrew/opt/libxml2/lib"
        export CPPFLAGS="-I/opt/homebrew/opt/expat/include -I/opt/homebrew/opt/libxml2/include"
        mkdir -p _build_arm64
        cd _build_arm64
        ../configure --prefix=/opt/homebrew \
          --disable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince \
          CFLAGS="-arch arm64" \
          CXXFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64 -L/opt/homebrew/opt/expat/lib -L/opt/homebrew/opt/libxml2/lib" \
          CPPFLAGS="-I/opt/homebrew/opt/expat/include -I/opt/homebrew/opt/libxml2/include"

    - name: Make (ARM64)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64
        make -j$(sysctl -n hw.logicalcpu)

    # ── x86_64 build (Rosetta) ───────────────────────────────────────────────
    - name: Configure (x86_64)
      run: |
        # Keep ARM64 Homebrew off the PATH completely
        export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
        # Both expat and libxml2 are keg-only in the Intel Homebrew prefix too
        export PKG_CONFIG_PATH="\
/usr/local/opt/expat/lib/pkgconfig:\
/usr/local/opt/libxml2/lib/pkgconfig:\
/usr/local/lib/pkgconfig:\
/usr/local/share/pkgconfig"
        export LDFLAGS="-L/usr/local/opt/expat/lib -L/usr/local/opt/libxml2/lib"
        export CPPFLAGS="-I/usr/local/opt/expat/include -I/usr/local/opt/libxml2/include"
        mkdir -p _build_x86_64
        cd _build_x86_64
        arch -x86_64 ../configure --prefix=/usr/local \
          --disable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince \
          CC="clang -arch x86_64" \
          CXX="clang++ -arch x86_64" \
          CFLAGS="-arch x86_64" \
          CXXFLAGS="-arch x86_64" \
          LDFLAGS="-arch x86_64 -L/usr/local/opt/expat/lib -L/usr/local/opt/libxml2/lib" \
          CPPFLAGS="-I/usr/local/opt/expat/include -I/usr/local/opt/libxml2/include" \
          PKG_CONFIG=/usr/local/bin/pkg-config

    - name: Make (x86_64)
      run: |
        export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
        cd _build_x86_64
        arch -x86_64 make -j$(sysctl -n hw.logicalcpu)

    # ── Combine slices into a universal binary ───────────────────────────────
    - name: Create universal binary with lipo
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        mkdir -p _build_universal
        ARM_BIN="_build_arm64/src/denemo"
        X86_BIN="_build_x86_64/src/denemo"
        UNIVERSAL_BIN="_build_universal/denemo"
        echo "=== ARM64 archs ===" && lipo -info "$ARM_BIN"
        echo "=== x86_64 archs ===" && lipo -info "$X86_BIN"
        lipo -create "$ARM_BIN" "$X86_BIN" -output "$UNIVERSAL_BIN"
        echo "=== Universal archs ===" && lipo -info "$UNIVERSAL_BIN"

    # ── Install ARM64 tree then replace binary with universal ────────────────
    - name: Make install (ARM64 tree)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64 && make install

    - name: Replace installed binary with universal binary
      run: |
        cp _build_universal/denemo /opt/homebrew/bin/denemo
        echo "=== Installed binary archs ===" && lipo -info /opt/homebrew/bin/denemo

    # ── Inspect & smoke test ─────────────────────────────────────────────────
    - name: Inspect installed files
      run: |
        echo "=== Binary ===" && find /opt/homebrew/bin -name "denemo*" 2>/dev/null
        echo "=== Share ===" && find /opt/homebrew/share/denemo -maxdepth 2 2>/dev/null || echo "No share/denemo"
        echo "=== Dylib dependencies ===" && otool -L /opt/homebrew/bin/denemo 2>/dev/null || echo "binary not found"
        echo "=== Icons ===" && find /opt/homebrew/share -name "*.icns" -o -name "denemo*.png" 2>/dev/null | head -10

    - name: Install bundle tools
      run: brew install dylibbundler create-dmg

    - name: Smoke test binary
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        /opt/homebrew/bin/denemo --version 2>&1 || true
        /opt/homebrew/bin/denemo --help 2>&1 | head -5 || true

    # ── Bundle and DMG ───────────────────────────────────────────────────────
    - name: Bundle app and create DMG
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export HOMEBREW_PREFIX="/opt/homebrew"
        chmod +x packaging/bundle-macos.sh
        ./packaging/bundle-macos.sh

    - name: Inspect LilyPond install
      run: |
        echo "=== LilyPond binary ===" && find /opt/homebrew -name "lilypond" -type f
        du -sh /opt/homebrew/Cellar/lilypond/ 2>/dev/null || echo "not in Cellar"
        du -sh /opt/homebrew/share/lilypond/ 2>/dev/null || echo "no share/lilypond"
        find macos_staging/Denemo.app/Contents/Resources/share/lilypond -maxdepth 2 -type d 2>/dev/null
        echo "=== Bundle sizes ==="
        du -sh macos_staging/Denemo.app/Contents/MacOS/ 2>/dev/null
        du -sh macos_staging/Denemo.app/Contents/libs/ 2>/dev/null
        du -sh macos_staging/Denemo.app/Contents/Resources/ 2>/dev/null
        du -sh macos_staging/Denemo.app/ 2>/dev/null

    # ── Upload artifact ──────────────────────────────────────────────────────
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: |
          Denemo-*-macOS.dmg
          Denemo.dmg
        if-no-files-found: warn
