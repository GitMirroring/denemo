name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      env:
        HOMEBREW_NO_ENV_HINTS: "1"
      run: |
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtk-doc \
          gtksourceview3 \
          evince \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond

    # ── Rosetta x86_64 Homebrew ──────────────────────────────────────────────
    # macos-15 runners are ARM64. To produce a universal binary we need an
    # x86_64 Homebrew prefix (/usr/local) populated via Rosetta so that we can
    # compile a thin x86_64 slice and then lipo the two slices together.
    - name: Install Rosetta 2
      run: softwareupdate --install-rosetta --agree-to-license

    - name: Bootstrap x86_64 Homebrew under Rosetta
      run: |
        # Install Homebrew into the legacy Intel prefix if it isn't there yet.
        if [ ! -f /usr/local/bin/brew ]; then
          arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi

    - name: Install x86_64 build dependencies via Rosetta
      env:
        # Suppress the "shadowed by /opt/homebrew/bin/..." hint that exits 1
        HOMEBREW_NO_ENV_HINTS: "1"
        HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
        # Keep ARM64 Homebrew entirely out of this step's PATH so brew itself
        # doesn't get confused about which prefix it's operating on.
        PATH: "/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
      run: |
        arch -x86_64 /usr/local/bin/brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtk-doc \
          gtksourceview3 \
          evince \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond

    # ── autotools (only needs to run once) ───────────────────────────────────
    - name: Run autotools
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        chmod +x autogen.sh
        ./autogen.sh

    # ── ARM64 (native) build ─────────────────────────────────────────────────
    - name: Configure (ARM64)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
        mkdir -p _build_arm64
        cd _build_arm64
        ../configure --prefix=/opt/homebrew \
          --disable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince \
          CFLAGS="-arch arm64" \
          CXXFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64"

    - name: Make (ARM64)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64
        make -j$(sysctl -n hw.logicalcpu)

    # ── x86_64 (Rosetta) build ───────────────────────────────────────────────
    - name: Configure (x86_64)
      env:
        HOMEBREW_NO_ENV_HINTS: "1"
        HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
      run: |
        # libxml2 is keg-only in Intel Homebrew - its .pc file lives under opt/
        export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
        export PKG_CONFIG_PATH="\
          /usr/local/opt/libxml2/lib/pkgconfig:\
          /usr/local/lib/pkgconfig:\
          /usr/local/share/pkgconfig"
        export LDFLAGS="-L/usr/local/opt/libxml2/lib"
        export CPPFLAGS="-I/usr/local/opt/libxml2/include"
        mkdir -p _build_x86_64
        cd _build_x86_64
        arch -x86_64 ../configure --prefix=/usr/local \
          --disable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince \
          CC="clang -arch x86_64" \
          CXX="clang++ -arch x86_64" \
          CFLAGS="-arch x86_64" \
          CXXFLAGS="-arch x86_64" \
          LDFLAGS="-arch x86_64 -L/usr/local/opt/libxml2/lib" \
          CPPFLAGS="-I/usr/local/opt/libxml2/include" \
          PKG_CONFIG=/usr/local/bin/pkg-config

    - name: Make (x86_64)
      env:
        HOMEBREW_NO_ENV_HINTS: "1"
        HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
      run: |
        export PATH="/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
        cd _build_x86_64
        arch -x86_64 make -j$(sysctl -n hw.logicalcpu)

    # ── Combine into universal binary with lipo ───────────────────────────────
    - name: Create universal binary with lipo
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

        ARM_BIN="_build_arm64/src/denemo"
        X86_BIN="_build_x86_64/src/denemo"
        UNIVERSAL_BIN="_build_universal/denemo"

        mkdir -p _build_universal

        echo "=== ARM64 binary archs ==="
        lipo -info "$ARM_BIN"
        echo "=== x86_64 binary archs ==="
        lipo -info "$X86_BIN"

        lipo -create "$ARM_BIN" "$X86_BIN" -output "$UNIVERSAL_BIN"

        echo "=== Universal binary archs ==="
        lipo -info "$UNIVERSAL_BIN"

    # ── Install (use ARM64 build for make install, then swap in universal) ───
    - name: Make install (ARM64 tree)
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64
        make install

    - name: Replace installed binary with universal binary
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cp _build_universal/denemo /opt/homebrew/bin/denemo
        echo "=== Installed binary archs ==="
        lipo -info /opt/homebrew/bin/denemo

    # ── Inspect & smoke test ─────────────────────────────────────────────────
    - name: Inspect installed files
      run: |
        echo "=== Binary ==="
        find /opt/homebrew/bin -name "denemo*" 2>/dev/null
        echo "=== Share ==="
        find /opt/homebrew/share/denemo -maxdepth 2 2>/dev/null || echo "No share/denemo"
        echo "=== Dylib dependencies ==="
        otool -L /opt/homebrew/bin/denemo 2>/dev/null || echo "binary not found"
        echo "=== Icons ==="
        find /opt/homebrew/share -name "*.icns" -o -name "denemo*.png" 2>/dev/null | head -10

    - name: Install bundle tools
      run: brew install dylibbundler create-dmg

    - name: Smoke test binary
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        /opt/homebrew/bin/denemo --version 2>&1 || true
        /opt/homebrew/bin/denemo --help 2>&1 | head -5 || true

    # ── Bundle and DMG ───────────────────────────────────────────────────────
    - name: Bundle app and create DMG
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export HOMEBREW_PREFIX="/opt/homebrew"
        chmod +x packaging/bundle-macos.sh
        ./packaging/bundle-macos.sh

    - name: Inspect LilyPond install
      run: |
        echo "=== LilyPond binary ==="
        find /opt/homebrew -name "lilypond" -type f
        echo "=== LilyPond size ==="
        du -sh /opt/homebrew/Cellar/lilypond/ 2>/dev/null || echo "not in Cellar"
        echo "=== LilyPond share ==="
        du -sh /opt/homebrew/share/lilypond/ 2>/dev/null || echo "no share/lilypond"
        echo "=== In bundle - LilyPond share dirs ==="
        find macos_staging/Denemo.app/Contents/Resources/share/lilypond -maxdepth 2 -type d 2>/dev/null
        echo "=== Bundle sizes ==="
        du -sh macos_staging/Denemo.app/Contents/MacOS/ 2>/dev/null
        du -sh macos_staging/Denemo.app/Contents/libs/ 2>/dev/null
        du -sh macos_staging/Denemo.app/Contents/Resources/ 2>/dev/null
        du -sh macos_staging/Denemo.app/ 2>/dev/null

    # ── Upload artifact (one step, wildcard covers either naming convention) ─
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: |
          Denemo-*-macOS.dmg
          Denemo.dmg
        if-no-files-found: warn
