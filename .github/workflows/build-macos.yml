name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        # Homebrew ships gtk+3 quartz-only - no variant flags needed.
        # evince 48.x has prebuilt Sequoia bottles - no compile needed.
        # libsmf is vendored in libs/libsmf/ - no install needed.
        # portmidi is disabled via --disable-portmidi in configure.
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtk-doc \
          gtksourceview3 \
          evince \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond


    - name: Run autotools
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
        mkdir -p _build
        cd _build
        # --disable-portmidi: portmidi is not in Homebrew and handles live
        # hardware MIDI input only - not needed for a CI/distribution build.
        # FluidSynth covers MIDI playback.
        ../configure --prefix=/opt/homebrew \
          --disable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince

    - name: Make
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make install

    - name: Inspect installed files
      run: |
        echo "=== Binary ==="
        find /opt/homebrew/bin -name "denemo*" 2>/dev/null
        echo "=== Share ==="
        find /opt/homebrew/share/denemo -maxdepth 2 2>/dev/null || echo "No share/denemo"
        echo "=== Dylib dependencies ==="
        otool -L /opt/homebrew/bin/denemo 2>/dev/null || echo "binary not found"
        echo "=== Icons ==="
        find /opt/homebrew/share -name "*.icns" -o -name "denemo*.png" 2>/dev/null | head -10
    - name: Install bundle tools
      run: brew install dylibbundler create-dmg

    - name: Bundle app and create DMG
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export HOMEBREW_PREFIX="/opt/homebrew"
        chmod +x packaging/bundle-macos.sh
        ./packaging/bundle-macos.sh

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo-*-macOS.dmg
 
 
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
