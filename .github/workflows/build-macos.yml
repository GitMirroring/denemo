name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MacPorts
      id: macports
      uses: melusina-org/setup-macports@v1

    - name: Install build dependencies
      run: |
        port install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkgconfig \
          gtk3 +quartz \
          librsvg +quartz \
          evince +quartz \
          gtksourceview3 +quartz \
          guile \
          aubio \
          portaudio \
          fftw-3 \
          libxml2 \
          fluidsynth \
          libsmf \
          portmidi \
          rubberband \
          libsndfile \
          gettext \
          jack \
          lilypond

    - name: Run autogen.sh
      run: ./autogen.sh

    - name: Configure
      run: |
        mkdir -p _build
        cd _build
        ../configure --prefix=/opt/local

    - name: Make
      run: |
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        cd _build
        make install

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/MacPorts/Denemo.app dmg_staging/
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "Denemo-macOS" \
          -srcfolder dmg_staging \
          -ov \
          -format UDZO \
          Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
