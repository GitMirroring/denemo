name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Homebrew packages
      id: cache-homebrew
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
          /opt/homebrew/lib
          /opt/homebrew/include
          /opt/homebrew/share
        key: homebrew-${{ runner.os }}-${{ runner.arch }}-denemo-deps-v2
        restore-keys: |
          homebrew-${{ runner.os }}-${{ runner.arch }}-denemo-deps-

    - name: Install build dependencies
      if: steps.cache-homebrew.outputs.cache-hit != 'true'
      run: |
        # Homebrew ships gtk+3 quartz-only - no variant flags needed.
        # evince 48.x has prebuilt Sequoia bottles - no compile needed.
        # Note: libsmf and portmidi are not in Homebrew core; we build
        # them from source in the next step.
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtksourceview3 \
          evince \
          guile \
          aubio \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          jack \
          lilypond

    - name: Build libsmf from source
      if: steps.cache-homebrew.outputs.cache-hit != 'true'
      run: |
        # libsmf is not in Homebrew core - build from source
        git clone https://github.com/stump/libsmf.git /tmp/libsmf
        cd /tmp/libsmf
        autoreconf -fi
        ./configure --prefix=/opt/homebrew
        make -j$(sysctl -n hw.logicalcpu)
        make install

    - name: Build portmidi from source
      if: steps.cache-homebrew.outputs.cache-hit != 'true'
      run: |
        # portmidi is not in Homebrew core - build from source
        git clone https://github.com/PortMidi/portmidi.git /tmp/portmidi
        cd /tmp/portmidi
        cmake -B build \
          -DCMAKE_INSTALL_PREFIX=/opt/homebrew \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(sysctl -n hw.logicalcpu)
        cmake --install build

    - name: Run autogen.sh
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        ./autogen.sh

    - name: Configure
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
        mkdir -p _build
        cd _build
        ../configure --prefix=/opt/homebrew

    - name: Make
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make install

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/Denemo.app dmg_staging/ 2>/dev/null || \
          echo "Note: no .app bundle found; DMG will contain raw binary"
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "Denemo-macOS" \
          -srcfolder dmg_staging \
          -ov \
          -format UDZO \
          Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
