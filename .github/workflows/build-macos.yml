name: Build Denemo for macOS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MacPorts
      # Using the dedicated marketplace action is the most reliable way to set up MacPorts
      uses: MacPorts/setup-macports@v1

    - name: Update MacPorts
      run: sudo port selfupdate

      name: Install Denemo
      # MacPorts will automatically handle all required dependencies like GTK+ and LilyPond
      run: sudo port install denemo


