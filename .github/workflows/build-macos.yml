name: Build Denemo for macOS
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Homebrew packages
      id: cache-homebrew
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
          /opt/homebrew/lib
          /opt/homebrew/include
          /opt/homebrew/share
        key: homebrew-${{ runner.os }}-${{ runner.arch }}-denemo-deps-v5
        restore-keys: |
          homebrew-${{ runner.os }}-${{ runner.arch }}-denemo-deps-

    - name: Install build dependencies
      if: steps.cache-homebrew.outputs.cache-hit != 'true'
      run: |
        # Homebrew ships gtk+3 quartz-only - no variant flags needed.
        # evince 48.x has prebuilt Sequoia bottles - no compile needed.
        # libsmf is vendored in libs/libsmf/ - no install needed.
        # portmidi is disabled via --disable-portmidi in configure.
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          librsvg \
          gtksourceview3 \
          evince \
          guile \
          aubio \
          portaudio \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          gettext \
          lilypond

    - name: Fix aclocal system directory
      run: |
        # autogen.sh hardcodes /usr/share/aclocal which doesn't exist on macOS.
        # Patch it in-place to use the Homebrew path instead.
        sed -i '' 's|/usr/share/aclocal|/opt/homebrew/share/aclocal|g' autogen.sh

    - name: Run autotools
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        GETTEXT_M4="$(brew --prefix gettext)/share/aclocal"
        SRCDIR="$(pwd)"
        glibtoolize --force --copy
        # Use absolute path for build/ so aclocal finds lib-link.m4 etc.
        aclocal \
          -I "$SRCDIR/build" \
          -I /opt/homebrew/share/aclocal \
          -I "$GETTEXT_M4"
        autoheader
        automake --add-missing --copy --force-missing
        autoconf

    - name: Configure
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
        mkdir -p _build
        cd _build
        # --disable-portmidi: portmidi is not in Homebrew and handles live
        # hardware MIDI input only - not needed for a CI/distribution build.
        # FluidSynth covers MIDI playback.
        ../configure --prefix=/opt/homebrew \
          --disable-portmidi \
          --disable-jack

    - name: Make
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make -j$(sysctl -n hw.logicalcpu)

    - name: Make install
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build
        make install

    - name: Prepare Staging Directory
      run: |
        mkdir -p dmg_staging
        cp -R /Applications/Denemo.app dmg_staging/ 2>/dev/null || \
          echo "Note: no .app bundle found; DMG will contain raw binary"
        ln -s /Applications dmg_staging/Applications

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "Denemo-macOS" \
          -srcfolder dmg_staging \
          -ov \
          -format UDZO \
          Denemo.dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-dmg
        path: Denemo.dmg
