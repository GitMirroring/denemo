name: Build Denemo MinGW64

on:
  push:
    branches: [mingw64]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-libunistring
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-lilypond
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-fluidsynth
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-evince
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-autotools

      # ── Build Guile ────────────────────────────────────────────────────────

      - name: Download Guile source
        run: |
          curl -L https://ftp.gnu.org/gnu/guile/guile-3.0.9.tar.gz -o guile.tar.gz
          tar xzf guile.tar.gz
          mv guile-3.0.9 guile-src

      - name: Configure Guile
        working-directory: guile-src
        run: |
          ./configure \
            --prefix=/mingw64 \
            --enable-mini-gmp \
            --enable-shared \
            --enable-static \
            --disable-nls \
            CFLAGS="-g -O2 -Wno-incompatible-pointer-types -Wno-int-conversion" \
            CPPFLAGS="-I/mingw64/include -isystem C:/msys64/mingw64/include" \
            LDFLAGS="-L/mingw64/lib" \
            PKG_CONFIG_PATH="/mingw64/lib/pkgconfig" \
            BDW_GC_CFLAGS="-I/mingw64/include" \
            BDW_GC_LIBS="-L/mingw64/lib -lgc"
          sed -i 's/#define GUILE_USE_64_CALLS 1/#define GUILE_USE_64_CALLS 0/' config.h

      - name: Build Guile
        working-directory: guile-src
        run: make -j$(nproc) 2>&1 | tee ../guile-build.log

      - name: Install Guile
        working-directory: guile-src
        run: make install

      - name: Verify Guile install
        run: |
          /mingw64/bin/guile --version
          pkg-config --modversion guile-3.0

      # ── Build Denemo ───────────────────────────────────────────────────────

      - name: Configure Denemo
        run: |
          autoreconf -fi || true
          ./configure \
            --prefix=/mingw64 \
            --with-guile \
            CFLAGS="-g -O2 -Wno-incompatible-pointer-types -Wno-int-conversion" \
            CPPFLAGS="-I/mingw64/include" \
            LDFLAGS="-L/mingw64/lib" \
            PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"

      - name: Build Denemo
        run: make -j$(nproc) 2>&1 | tee denemo-build.log

      - name: Install Denemo
        run: make install

      # ── Artifacts ─────────────────────────────────────────────────────────

      - name: Upload Guile DLLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guile-mingw64
          path: /mingw64/bin/libguile*.dll

      - name: Upload Denemo binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denemo-mingw64
          path: |
            /mingw64/bin/denemo.exe
            /mingw64/share/denemo/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            guile-build.log
            denemo-build.log
