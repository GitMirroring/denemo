name: Build Denemo

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-denemo:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-fluidsynth
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-aubio
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-gtksourceview3
            mingw-w64-x86_64-portmidi
            mingw-w64-x86_64-evince
            mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-gc
            intltool
            mingw-w64-x86_64-nsis
 
      - name: Remove MSYS2 Guile to avoid conflict with custom build
        run: |
          pacman -R --noconfirm mingw-w64-x86_64-guile || echo "guile not installed by pacman, skipping"

      - name: Download deps artifact
        shell: pwsh
        run: |
          $headers = @{Authorization = "token ${{ secrets.DEPS_TOKEN }}"}
          $artifacts = Invoke-RestMethod -Uri "https://api.github.com/repos/jbenham2015/denemo-mingw64-deps/actions/artifacts" -Headers $headers
          $artifact = $artifacts.artifacts | Where-Object { $_.name -eq "denemo-mingw64-deps" } | Select-Object -First 1
          $downloadUrl = $artifact.archive_download_url
          Invoke-WebRequest -Uri $downloadUrl -Headers $headers -OutFile "D:\a\Denemo\Denemo\denemo-mingw64-deps.zip"
          Expand-Archive -Path "D:\a\Denemo\Denemo\denemo-mingw64-deps.zip" -DestinationPath "D:\a\Denemo\Denemo\"
      - name: Extract deps
        run: |
          cd /d/a/Denemo/Denemo
          tar xzf denemo-mingw64-deps.tar.gz
          cp -rf mingw64/bin/* /mingw64/bin/
          cp -rf mingw64/lib/* /mingw64/lib/
          cp -rf mingw64/include/* /mingw64/include/
          cp -rf mingw64/share/guile /mingw64/share/
          ls /mingw64/bin/libguile*.dll || echo "no libguile dll found"
          # Debug: check compiler modules exist
          ls /mingw64/share/guile/3.0/language/tree-il || echo "tree-il missing"
          ls /mingw64/share/guile/3.0/language/ || echo "no language dir"
          guild --version
          guile --version
      - name: Bootstrap Denemo
        run: autoreconf -fi

      - name: Configure Denemo
        run: |
          ./configure \
            --prefix=/mingw64 \
            --enable-evince \
            --enable-portmidi \
            CFLAGS="-g -O2 -Wno-incompatible-pointer-types -Wno-int-conversion" \
            CPPFLAGS="-I/mingw64/include" \
            LDFLAGS="-L/mingw64/lib" \
            PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"

      - name: Build Denemo
        run: make -j$(nproc) 2>&1 | tee /d/a/Denemo/Denemo/denemo-build.log

      - name: Install Denemo
        run: |
          mkdir -p /mingw64/share/denemo
          make install prefix=/mingw64
      
      - name: Stage built Denemo files
        run: |
          mkdir -p /d/a/Denemo/Denemo/staged/bin
          mkdir -p /d/a/Denemo/Denemo/staged/lib/guile/3.0/ccache
          mkdir -p /d/a/Denemo/Denemo/staged/share/denemo

          # Copy denemo.exe to Windows-native path
          cp -v /mingw64/bin/denemo.exe /d/a/Denemo/Denemo/staged/bin/denemo.exe
          rm -f /mingw64/bin/denemo

          cp -rf /mingw64/lib/guile/3.0/ccache/* \
            /d/a/Denemo/Denemo/staged/lib/guile/3.0/ccache/ || true
          cp -rf /mingw64/share/denemo/* \
            /d/a/Denemo/Denemo/staged/share/denemo/ || true

          echo "staged/bin contents:"
          ls -la /d/a/Denemo/Denemo/staged/bin/

          # Copy lilypond-windows wrapper into lilypond/bin
          mkdir -p /d/a/Denemo/Denemo/staged/lilypond/bin
          cp -v /mingw64/bin/lilypond-windows.exe \
            /d/a/Denemo/Denemo/staged/lilypond/bin/ || echo "WARNING: lilypond-windows.exe not found"
      
      - name: Download and stage LilyPond
        shell: pwsh
        run: |
          $staged = "D:\a\Denemo\Denemo\staged"
          $lilyUrl = "https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-mingw-x86_64.zip"
          $lilyZip = "D:\a\Denemo\Denemo\lilypond.zip"
          $lilyExtract = "D:\a\Denemo\Denemo\lilypond-extract"

          Write-Host "Downloading LilyPond..."
          Invoke-WebRequest -Uri $lilyUrl -OutFile $lilyZip

          Write-Host "Extracting LilyPond..."
          Expand-Archive -Path $lilyZip -DestinationPath $lilyExtract -Force

          Write-Host "LilyPond extracted contents:"
          Get-ChildItem $lilyExtract | Select-Object Name

          # Find the top-level lilypond directory inside the zip
          $lilyDir = Get-ChildItem $lilyExtract -Directory | Select-Object -First 1
          Write-Host "LilyPond dir: $($lilyDir.FullName)"

          # Copy into staged/lilypond
          robocopy $lilyDir.FullName "$staged\lilypond" /E /NFL /NDL /NJH
          if ($LASTEXITCODE -gt 7) { throw "robocopy lilypond failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          $size = (Get-ChildItem "$staged\lilypond" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "LilyPond staged: $([math]::Round($size,1)) MB"

          `
      - name: Stage installer files
        shell: pwsh
        run: |
          $staged = "D:\a\Denemo\Denemo\staged"
          $mingw  = "D:\a\_temp\msys64\mingw64"

          New-Item -ItemType Directory -Force -Path "$staged\bin"
          New-Item -ItemType Directory -Force -Path "$staged\lib"
          New-Item -ItemType Directory -Force -Path "$staged\share"
          New-Item -ItemType Directory -Force -Path "$staged\etc"
          New-Item -ItemType Directory -Force -Path "$staged\license"
          New-Item -ItemType Directory -Force -Path "$staged\share\icons\hicolor"

          # Copy only required DLLs based on ntldd analysis
          Get-Content "D:\a\Denemo\Denemo\required-dlls.txt" | ForEach-Object {
            $dll = $_.Trim()
            if (Test-Path $dll) {
              Copy-Item -Force $dll "$staged\bin\"
            } else {
              Write-Host "WARNING: not found: $dll"
            }
          }
          Remove-Item -Force "$staged\bin\denemo" -ErrorAction SilentlyContinue
          Write-Host "Copied $(Get-ChildItem "$staged\bin\*.dll" | Measure-Object | Select-Object -ExpandProperty Count) DLLs"
          Write-Host "denemo.exe present: $(Test-Path "$staged\bin\denemo.exe")"
          
          # Add runtime-loaded plugin dependencies ntldd missed
          @(
            'libpoppler-glib-8.dll',
            'libpoppler-cpp-0.dll',
            'libcurl-4.dll',
            'libnspr4.dll',
            'nss3.dll',
            'libplc4.dll',
            'smime3.dll'
          ) | ForEach-Object {
            $dll = "$mingw\bin\$_"
            if (Test-Path $dll) {
              Copy-Item -Force $dll "$staged\bin\"
              Write-Host "Added: $_"
            } else {
              Write-Host "WARNING: not found: $_"
            }
          }
          # libpoppler main dll has version number - find it dynamically
          Get-ChildItem "$mingw\bin\libpoppler-[0-9]*.dll" | ForEach-Object {
            Copy-Item -Force $_.FullName "$staged\bin\"
            Write-Host "Added: $($_.Name)"
          }
          # Runtime lib subdirs Denemo needs
          @(
            'gdk-pixbuf-2.0',
            'gtk-3.0',
            'gio',
            'girepository-1.0',
            'guile',
            'evince'
          ) | ForEach-Object {
            if (Test-Path "$mingw\lib\$_") {
              robocopy "$mingw\lib\$_" "$staged\lib\$_" /E /NFL /NDL /NJH
            }
          }

          # Share subdirs Denemo needs
          @(
            'denemo',
            'glib-2.0',
            'gtk-3.0',
            'gtksourceview-3',
            'icons',
            'mime',
            'guile',
            'fonts',
            'themes'
          ) | ForEach-Object {
            if (Test-Path "$mingw\share\$_") {
              robocopy "$mingw\share\$_" "$staged\share\$_" /E /NFL /NDL /NJH
            }
          }

          # etc
          robocopy "$mingw\etc" "$staged\etc" /E /NFL /NDL /NJH

          # Packaging files
          Copy-Item -Force "D:\a\Denemo\Denemo\COPYING" "$staged\license\denemo"
          Copy-Item -Force "D:\a\Denemo\Denemo\packaging\nsis\Denemo.bat" "$staged\"
          Copy-Item -Force "D:\a\Denemo\Denemo\packaging\regfont.exe" "$staged\bin\"
          Copy-Item -Force "D:\a\Denemo\Denemo\packaging\denemo.ico" "$staged\share\icons\hicolor\denemo.ico"
          Copy-Item -Force "D:\a\Denemo\Denemo\pixmaps\denemo.png" "$staged\share\icons\hicolor\denemo.png"
          Copy-Item -Force "D:\a\Denemo\Denemo\pixmaps\org.denemo.Denemo.png" "$staged\share\icons\hicolor\org.denemo.Denemo.png"
          $size = (Get-ChildItem $staged -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Staged size: $([math]::Round($size,1)) MB"
          exit 0

      - name: Collect plugin DLL dependencies
        run: |
          echo "Scanning staged lib for plugin DLLs..."
          find /d/a/Denemo/Denemo/staged/lib -name "*.dll" 2>/dev/null | while read dll; do
            ntldd -R "$dll" 2>/dev/null \
              | grep -i mingw64 \
              | awk '{print $3}'
          done | sort -u > /d/a/Denemo/Denemo/plugin-dlls.txt

          echo "Plugin deps found: $(wc -l < /d/a/Denemo/Denemo/plugin-dlls.txt)"

          while IFS= read -r winpath; do
            drive=$(echo "$winpath" | cut -c1 | tr 'A-Z' 'a-z')
            rest=$(echo "$winpath" | cut -c3- | sed 's|\\|/|g')
            msyspath="/${drive}${rest}"
            base=$(basename "$msyspath")
            if [ ! -f "/d/a/Denemo/Denemo/staged/bin/$base" ]; then
              echo "Adding missing: $base"
              cp "$msyspath" /d/a/Denemo/Denemo/staged/bin/ || true
            fi
          done < /d/a/Denemo/Denemo/plugin-dlls.txt

          echo "Final DLL count: $(find /d/a/Denemo/Denemo/staged/bin -name '*.dll' | wc -l)"

      - name: Trim staged tree
        run: |
          P=/d/a/Denemo/Denemo/staged
          rm -rf $P/share/doc
          rm -rf $P/include
          rm -rf $P/lib/*.a
          rm -rf $P/share/texmf-texlive
          rm -rf $P/share/s*
          rm -rf $P/share/x*
          rm -rf $P/share/y*
          rm -rf $P/share/X*
          rm -rf $P/share/v*
          rm -rf $P/share/ma*
          rm -rf $P/share/j*
          rm -rf $P/share/a*
          rm -rf $P/share/b*
          rm -rf $P/share/c*
          rm -rf $P/share/h*
          rm -rf $P/share/p*
          rm -rf $P/share/nls
          rm -rf $P/share/info
          rm -rf $P/share/icons/HighContrast
          rm -rf $P/share/locale
          rm -rf $P/share/examples
          rm -rf $P/share/emacs
          rm -rf $P/lib/per*
          rm -rf $P/var
          rm -rf $P/share/Im*
          rm -rf $P/lib/cmake
          rm -rf $P/lib/pkgconfig
          rm -rf $P/lib/ldscripts
          rm -rf $P/share/gtk-doc
          rm -rf $P/share/gettext
          rm -rf $P/share/meson
          rm -f  $P/bin/libgfortran-5.dll
          rm -f  $P/bin/libboost_wave-mt-x64.dll

          # Report final size
          echo "=== Size breakdown ==="
          du -sh $P/*/
          echo "=== LilyPond breakdown ==="
          du -sh $P/lilypond/*/
          echo "=== bin DLL count and size ==="
          ls $P/bin/*.dll | wc -l
          du -sh $P/bin/

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = (Select-String -Path "D:\a\Denemo\Denemo\configure.ac" -Pattern "AC_INIT" | Select-Object -First 1).Line
          $version = [regex]::Match($version, '\d+\.\d+\.\d+').Value
          Write-Host "Building installer for version $version"
          $rootPath = (Resolve-Path "D:\a\Denemo\Denemo\staged").Path
          Write-Host "Root path: $rootPath"
          Set-Location D:\a\Denemo\Denemo\packaging\nsis
          & "D:\a\_temp\msys64\mingw64\bin\makensis.exe" /DVERSION=$version "/DROOT=$rootPath" denemo.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: denemo-windows-installer
          path: D:/a/Denemo/Denemo/packaging/nsis/Denemo-*-setup.exe

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denemo-build-log
          path: /d/a/Denemo/Denemo/denemo-build.log
